<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KALI LAB — Hacker daftar</title>
    <style>
        :root {
            --bg: #070b14;
            --bg2: #0d1424;
            --panel: #111b30;
            --line: #1f2e4d;
            --tx: #d6e2ff;
            --mute: #7a8bb0;
            --blue: #367bf0;
            --cyan: #27e1ff;
            --red: #ff4d6d;
            --amb: #ffb02e;
            --grn: #3ddc97;
            --mono: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            overflow: hidden
        }

        canvas#rain {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: .13;
            pointer-events: none
        }

        aside {
            position: relative;
            z-index: 2;
            width: 250px;
            flex: none;
            background: linear-gradient(180deg, var(--bg2), #080d19);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            padding: 20px 14px
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 2px
        }

        .logo b {
            color: var(--blue);
            text-shadow: 0 0 18px var(--blue)
        }

        .sub {
            color: var(--mute);
            font-size: 12px;
            margin-bottom: 22px
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        nav button {
            background: none;
            border: 1px solid transparent;
            color: var(--mute);
            text-align: left;
            padding: 10px 12px;
            border-radius: 8px;
            font: inherit;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        nav button:hover {
            color: var(--tx);
            background: #0f1a31
        }

        nav button.on {
            color: #fff;
            background: linear-gradient(90deg, rgba(54, 123, 240, .28), rgba(39, 225, 255, .05));
            border-color: var(--blue);
            box-shadow: 0 0 22px rgba(54, 123, 240, .25)
        }

        nav .n {
            font-size: 11px;
            background: #0a1226;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 8px;
            color: var(--cyan)
        }

        .side-foot {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .btn {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--tx);
            padding: 8px 12px;
            border-radius: 8px;
            font: inherit;
            cursor: pointer;
            transition: .15s
        }

        .btn:hover {
            border-color: var(--blue);
            box-shadow: 0 0 14px rgba(54, 123, 240, .35)
        }

        .btn.pri {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
            font-weight: 700
        }

        .btn.pri:hover {
            background: #4a8bff
        }

        .btn.del {
            color: var(--red)
        }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            overflow-y: auto;
            padding: 26px 34px 60px
        }

        .term {
            background: #050810;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(54, 123, 240, .12)
        }

        .term .bar {
            display: flex;
            gap: 7px;
            align-items: center;
            padding: 9px 14px;
            background: #0b1326;
            border-bottom: 1px solid var(--line);
            color: var(--mute);
            font-size: 12px
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%
        }

        .term pre {
            padding: 16px 18px;
            color: var(--grn);
            white-space: pre-wrap;
            min-height: 96px;
            font-family: var(--mono)
        }

        .term .pr {
            color: var(--blue)
        }

        .term .hl {
            color: var(--cyan)
        }

        .cur {
            display: inline-block;
            width: 9px;
            height: 16px;
            background: var(--cyan);
            vertical-align: -3px;
            animation: bl 1s steps(2) infinite
        }

        @keyframes bl {
            50% {
                opacity: 0
            }
        }

        .tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center
        }

        .search {
            flex: 1;
            min-width: 200px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--tx);
            padding: 10px 14px;
            border-radius: 8px;
            font: inherit
        }

        .search:focus,
        .in:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(39, 225, 255, .15)
        }

        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        .chip {
            border: 1px solid var(--line);
            background: none;
            color: var(--mute);
            padding: 4px 12px;
            border-radius: 20px;
            font: inherit;
            font-size: 12px;
            cursor: pointer
        }

        .chip.on,
        .chip:hover {
            color: #fff;
            border-color: var(--cyan);
            background: rgba(39, 225, 255, .1)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 3px solid var(--blue);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: .15s;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--cyan);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .45)
        }

        .card h3 {
            font-size: 15px;
            color: #fff;
            word-break: break-word
        }

        .card .meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 11px;
            color: var(--mute)
        }

        .tag {
            color: var(--cyan);
            border: 1px solid rgba(39, 225, 255, .35);
            border-radius: 4px;
            padding: 0 6px
        }

        .st {
            border-radius: 4px;
            padding: 0 7px;
            font-size: 11px;
            font-weight: 700
        }

        .st.j {
            background: rgba(255, 176, 46, .15);
            color: var(--amb)
        }

        .st.t {
            background: rgba(61, 220, 151, .15);
            color: var(--grn)
        }

        .st.m {
            background: rgba(255, 77, 109, .15);
            color: var(--red)
        }

        .prev {
            color: #9fb0d6;
            font-size: 13px;
            max-height: 84px;
            overflow: hidden;
            white-space: pre-wrap;
            word-break: break-word;
            -webkit-mask-image: linear-gradient(#000 55%, transparent);
            mask-image: linear-gradient(#000 55%, transparent)
        }

        .card.code {
            border-left-color: var(--grn)
        }

        .card.lab {
            border-left-color: var(--red)
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: var(--mute)
        }

        .empty b {
            color: var(--cyan);
            display: block;
            font-size: 16px;
            margin-bottom: 6px
        }

        /* dictionary */
        .dict {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .row {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 6px 18px
        }

        .row .t {
            color: var(--cyan);
            font-weight: 700;
            word-break: break-word
        }

        .row .c {
            font-size: 11px;
            color: var(--mute)
        }

        .row .d {
            color: var(--tx)
        }

        .ex {
            grid-column: 2;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: #050810;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 7px 10px;
            color: var(--grn);
            font-size: 13px;
            word-break: break-all
        }

        .ex span {
            flex: 1
        }

        .ex button {
            background: none;
            border: 1px solid var(--line);
            color: var(--mute);
            border-radius: 5px;
            font: inherit;
            font-size: 11px;
            padding: 1px 8px;
            cursor: pointer
        }

        .ex button:hover {
            color: #fff;
            border-color: var(--cyan)
        }

        /* modal */
        .ov {
            position: fixed;
            inset: 0;
            background: rgba(2, 5, 12, .82);
            backdrop-filter: blur(4px);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px
        }

        .ov.on {
            display: flex
        }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--blue);
            border-radius: 14px;
            width: min(820px, 100%);
            max-height: 94vh;
            overflow: auto;
            padding: 22px;
            box-shadow: 0 0 70px rgba(54, 123, 240, .35);
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .modal h2 {
            font-size: 16px;
            color: #fff
        }

        .in {
            width: 100%;
            background: #050810;
            border: 1px solid var(--line);
            color: var(--tx);
            padding: 10px 12px;
            border-radius: 8px;
            font: inherit
        }

        textarea.in {
            min-height: 300px;
            resize: vertical;
            tab-size: 2;
            line-height: 1.5
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .act {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap
        }

        label {
            font-size: 12px;
            color: var(--mute);
            display: block;
            margin-bottom: 3px
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--blue);
            color: #fff;
            padding: 9px 16px;
            border-radius: 8px;
            z-index: 20;
            opacity: 0;
            transform: translateY(10px);
            transition: .2s;
            pointer-events: none
        }

        .toast.on {
            opacity: 1;
            transform: none
        }

        @media(max-width:760px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto
            }

            aside {
                width: 100%;
                padding: 12px;
                border-right: 0;
                border-bottom: 1px solid var(--line)
            }

            .sub {
                display: none
            }

            nav {
                flex-direction: row;
                overflow-x: auto
            }

            nav button {
                white-space: nowrap
            }

            .side-foot {
                flex-direction: row;
                margin-top: 10px
            }

            .side-foot .btn {
                flex: 1
            }

            main {
                padding: 16px;
                overflow: visible
            }

            .grid {
                grid-template-columns: 1fr
            }

            .row {
                grid-template-columns: 1fr
            }

            .ex {
                grid-column: 1
            }

            .two {
                grid-template-columns: 1fr
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }

        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px
        }
    </style>
</head>

<body>
    <canvas id="rain"></canvas>
    <aside>
        <div class="logo">KALI<b>_</b>LAB</div>
        <div class="sub">shaxsiy hacker daftar</div>
        <nav id="nav"></nav>
        <div class="side-foot">
            <button class="btn" id="exp">⬇ Zaxira (JSON)</button>
            <button class="btn" id="imp">⬆ Tiklash</button>
            <input type="file" id="file" accept=".json" hidden>
        </div>
    </aside>
    <main>
        <div class="term">
            <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot"
                    style="background:#febc2e"></span><span class="dot"
                    style="background:#28c840"></span>&nbsp;root@kali: ~</div>
            <pre id="tty"></pre>
        </div>
        <div id="view"></div>
    </main>

    <div class="ov" id="ov">
        <div class="modal" id="modal"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        /* ---------- Lug'at ma'lumotlari: kategoriya|atama|izoh|misol ---------- */
        const DICT = `Tarmoq|nmap|Tarmoq va portlarni skanerlash vositasi.|nmap -sV -sC -p- 192.168.1.10

Wi-Fi|airodump-ng|Atrofdagi Wi-Fi tarmoqlarini ko'rsatadi.|sudo airodump-ng wlan0mon

        const TABS = [['note', 'Yozuvlar'], ['code', 'Kodlar'], ['lab', 'Laboratoriyalar'], ['dict', "Lug'at"]];
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600) }
        function copy(s) { navigator.clipboard?.writeText(s).then(() => toast('Nusxalandi ✓')).catch(() => toast('Nusxalab bo\'lmadi')) }

        /* ---------- Navigatsiya ---------- */
        function nav() {
            $('#nav').innerHTML = TABS.map(([k, n]) => {
                const c = k === 'dict' ? DICT.length : db.filter(x => x.type === k).length;
                return `<button class="${k === tab ? 'on' : ''}" data-t="${k}"><span>${n}</span><span class="n">${c}</span></button>`
            }).join('');
        }
        $('#nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; q = ''; tagF = ''; catF = ''; render() };

        /* ---------- Ko'rinish ---------- */
        function render() { nav(); tab === 'dict' ? renderDict() : renderItems() }
        const ST = { j: ['Jarayonda', 'j'], t: ['Tugallangan', 't'], m: ['Muammo bor', 'm'] };
        function renderItems() {
            const label = { note: 'yozuv', code: 'kod', lab: 'laboratoriya' }[tab];
            const all = db.filter(x => x.type === tab);
            const tags = [...new Set(all.flatMap(x => x.tags || []))].sort();
            let list = all.filter(x => (!tagF || (x.tags || []).includes(tagF)) && (!q || (x.title + ' ' + x.body + ' ' + (x.tags || []).join(' ')).toLowerCase().includes(q.toLowerCase())));
            list.sort((a, b) => b.date - a.date);
            $('#view').innerHTML = `
  <div class="tools"><input class="search" id="q" placeholder="Qidirish: nom, matn, teg..." value="${esc(q)}"><button class="btn pri" id="add">+ Yangi ${label}</button></div>
  ${tags.length ? `<div class="chips">${tags.map(t => `<button class="chip ${t === tagF ? 'on' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : ''}
  ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty"><b>Hozircha bo'sh</b>${all.length ? 'Qidiruv bo\'yicha hech narsa topilmadi.' : `Birinchi ${label}ni qo'shish uchun "+ Yangi ${label}" tugmasini bosing.`}</div>`}`;
            $('#add').onclick = () => edit();
            const qi = $('#q'); qi.oninput = () => { q = qi.value; const p = qi.selectionStart; renderItems(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p) };
            $('#view').querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { tagF = tagF === b.dataset.tag ? '' : b.dataset.tag; renderItems() });
            $('#view').querySelectorAll('.card').forEach(c => c.onclick = () => edit(c.dataset.id));
        }
        function card(x) {
            const st = x.type === 'lab' ? `<span class="st ${ST[x.status || 'j'][1]}">${ST[x.status || 'j'][0]}</span>` : '';
            const lg = x.type === 'code' && x.lang ? `<span class="tag" style="color:var(--grn);border-color:var(--grn)">${esc(x.lang)}</span>` : '';
            const d = new Date(x.date).toLocaleDateString('uz-UZ');
            return `<div class="card ${x.type}" data-id="${x.id}"><h3>${esc(x.title || 'Nomsiz')}</h3>
  <div class="meta">${st}${lg}${(x.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}<span>${d}</span></div>
  <div class="prev">${esc(x.body)}</div></div>`;
        }

        /* ---------- Tahrirlash oynasi ---------- */
        function edit(id) {
            const x = id ? db.find(i => i.id === id) : { type: tab, title: '', body: '', tags: [], lang: 'bash', status: 'j' };
            const isCode = x.type === 'code', isLab = x.type === 'lab';
            $('#modal').innerHTML = `<h2>${id ? 'Tahrirlash' : 'Yangi'}: ${{ note: 'yozuv', code: 'kod', lab: 'laboratoriya' }[x.type]}</h2>
  <div><label>Nom</label><input class="in" id="f-title" value="${esc(x.title)}" placeholder="${isLab ? 'Masalan: DVWA — SQL injection' : 'Sarlavha'}"></div>
  <div class="two"><div><label>Teglar (vergul bilan)</label><input class="in" id="f-tags" value="${esc((x.tags || []).join(', '))}" placeholder="nmap, web, recon"></div>
  ${isCode ? `<div><label>Til</label><input class="in" id="f-lang" value="${esc(x.lang || 'bash')}" placeholder="bash, python..."></div>` : ''}
  ${isLab ? `<div><label>Holat</label><select class="in" id="f-st">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${x.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>` : ''}</div>
  <div><label>${isCode ? 'Kod' : isLab ? 'Jarayon: maqsad, buyruqlar, natija, xulosa' : 'Matn'}</label><textarea class="in" id="f-body" spellcheck="false" placeholder="${isLab ? 'Maqsad:\nVositalar:\nQadamlar:\nNatija:' : ''}">${esc(x.body)}</textarea></div>
  <div class="act">${id ? '<button class="btn del" id="b-del">O\'chirish</button>' : ''}${x.body ? '<button class="btn" id="b-copy">Nusxalash</button>' : ''}<button class="btn" id="b-x">Bekor qilish</button><button class="btn pri" id="b-ok">Saqlash</button></div>`;
            $('#ov').classList.add('on');
            $('#f-title').focus();
            $('#b-x').onclick = close;
            $('#b-copy') && ($('#b-copy').onclick = () => copy($('#f-body').value));
            $('#b-ok').onclick = () => {
                const o = {
                    id: id || ('i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)), type: x.type,
                    title: $('#f-title').value.trim(), body: $('#f-body').value,
                    tags: $('#f-tags').value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean), date: Date.now()
                };
                if (isCode) o.lang = $('#f-lang').value.trim();
                if (isLab) o.status = $('#f-st').value;
                if (!o.title && !o.body.trim()) { toast('Nom yoki matn yozing'); return }
                if (id) db[db.findIndex(i => i.id === id)] = o; else db.push(o);
                save(); close(); render(); toast('Saqlandi ✓');
            };
            $('#b-del') && ($('#b-del').onclick = () => { if (confirm('Rostdan o\'chirilsinmi?')) { db = db.filter(i => i.id !== id); save(); close(); render() } });
        }
        function close() { $('#ov').classList.remove('on') }
        $('#ov').onclick = e => { if (e.target.id === 'ov') close() };
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') close();
            if ((e.ctrlKey || e.metaKey) && e.key === 's' && $('#ov').classList.contains('on')) { e.preventDefault(); $('#b-ok').click() }
        });
        /* Tab tugmasi textarea ichida */
        document.addEventListener('keydown', e => { if (e.target.id === 'f-body' && e.key === 'Tab') { e.preventDefault(); const t = e.target, s = t.selectionStart; t.setRangeText('  ', s, t.selectionEnd, 'end') } });

        /* ---------- Lug'at ---------- */
        function renderDict() {
            const cats = [...new Set(DICT.map(d => d.c))];
            const list = DICT.filter(d => (!catF || d.c === catF) && (!q || (d.t + ' ' + d.d + ' ' + d.e).toLowerCase().includes(q.toLowerCase())));
            $('#view').innerHTML = `<div class="tools"><input class="search" id="q" placeholder="Buyruq yoki atamani qidiring: nmap, shell, hash..." value="${esc(q)}"></div>
  <div class="chips"><button class="chip ${!catF ? 'on' : ''}" data-c="">Hammasi</button>${cats.map(c => `<button class="chip ${c === catF ? 'on' : ''}" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="dict">${list.map((d, i) => `<div class="row"><div><div class="t">${esc(d.t)}</div><div class="c">${esc(d.c)}</div></div><div class="d">${esc(d.d)}</div>${d.e ? `<div class="ex"><span>$ ${esc(d.e)}</span><button data-e="${i}">copy</button></div>` : ''}</div>`).join('') || '<div class="empty"><b>Topilmadi</b>Boshqa so\'z bilan qidirib ko\'ring.</div>'}</div>`;
            const qi = $('#q'); qi.oninput = () => { q = qi.value; const p = qi.selectionStart; renderDict(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p) };
            $('#view').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { catF = b.dataset.c; renderDict() });
            $('#view').querySelectorAll('[data-e]').forEach(b => b.onclick = () => copy(list[b.dataset.e].e));
        }

        /* ---------- Zaxira ---------- */
        $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' })); a.download = 'kali-lab-zaxira.json'; a.click(); toast('Zaxira yuklandi') };
        $('#imp').onclick = () => $('#file').click();
        $('#file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d)) throw 0; const ids = new Set(db.map(i => i.id)); d.forEach(i => { if (i && i.id && !ids.has(i.id)) db.push(i) }); save(); render(); toast('Tiklandi ✓') } catch (x) { toast('Fayl noto\'g\'ri') } }; r.readAsText(f); e.target.value = '' };

        /* ---------- Terminal animatsiya ---------- */
        (function () {
            const lines = [['pr', 'root@kali:~# ', 'whoami'], ['', 'kali-lab operator', ''], ['pr', 'root@kali:~# ', 'cat /etc/motto'], ['hl', 'Yozib bor. Sinab ko\'r. Saqla.', '']];
            const el = $('#tty'); let out = '', li = 0, ci = 0;
            const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
            const html = (done) => el.innerHTML = out + (done ? '' : '') + '<span class="cur"></span>';
            function line(l) { return l[0] === 'pr' ? `<span class="pr">${l[1]}</span>${l[2]}` : `<span class="${l[0]}">${l[1]}</span>` }
            if (reduce) { el.innerHTML = lines.map(line).join('\n') + '\n<span class="pr">root@kali:~# </span><span class="cur"></span>'; return }
            function step() {
                if (li >= lines.length) { el.innerHTML = out + '<span class="pr">root@kali:~# </span><span class="cur"></span>'; return }
                const l = lines[li];
                if (l[0] === 'pr') {
                    if (ci < l[2].length) { ci++; el.innerHTML = out + `<span class="pr">${l[1]}</span>${l[2].slice(0, ci)}<span class="cur"></span>`; setTimeout(step, 60) }
                    else { out += line(l) + '\n'; li++; ci = 0; setTimeout(step, 300) }
                } else { out += line(l) + '\n'; li++; setTimeout(step, 250) }
            }
            step();
        })();

        /* ---------- Matrix yomg'ir (fon) ---------- */
        (function () {
            const c = $('#rain'), x = c.getContext('2d'); let w, h, cols, drops;
            const ch = '01ABCDEF<>/{}$#';
            function size() { w = c.width = innerWidth; h = c.height = innerHeight; cols = Math.ceil(w / 16); drops = Array.from({ length: cols }, () => Math.random() * h / 16) }
            size(); addEventListener('resize', size);
            if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
            setInterval(() => {
                x.fillStyle = 'rgba(7,11,20,.14)'; x.fillRect(0, 0, w, h); x.fillStyle = '#367bf0'; x.font = '14px monospace';
                drops.forEach((d, i) => { x.fillText(ch[Math.random() * ch.length | 0], i * 16, d * 16); if (d * 16 > h && Math.random() > .975) drops[i] = 0; drops[i] += 1 });
            }, 60);
        })();

        render();
    </script>
</body>

</html>
